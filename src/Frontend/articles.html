<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/logo-mark.svg">
    <title>Articles - DevPilot AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <div id="navbar" data-active="articles"></div>

    <section class="page-shell">
        <div class="container">
            <span class="page-kicker"><i class="fa-solid fa-book-open"></i> Public Knowledge Base</span>
            <h1 class="page-title">Learn from <span class="text-primary-brand">Real Fixes</span></h1>
            <p class="page-lead">Browse solved developer problems with root cause, steps, and corrected code — structured the same way every time.</p>

            <form id="search-form" class="search-bar mb-4">
                <input type="search" id="search-q" class="form-control flex-grow-1"
                    placeholder="Search by title, error name, technology, code, or keyword…">
                <div class="tech-multiselect" id="tech-multiselect">
                    <button type="button" class="form-control tech-multiselect-toggle" id="tech-toggle" aria-expanded="false">
                        <span id="tech-toggle-label">All technologies</span>
                        <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
                    </button>
                    <div class="tech-multiselect-menu d-none" id="tech-menu" role="listbox" aria-label="Technologies"></div>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
            </form>

            <div id="articles-grid" class="row g-3">
                <div class="col-12"><div class="empty-state">Loading articles…</div></div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/articles.js"></script>
</body>

</html>
