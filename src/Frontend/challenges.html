<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/logo-mark.svg">
    <title>Challenges - DevPilot AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/media.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <div id="navbar" data-active="challenges"></div>

    <section class="page-shell">
        <div class="container">
            <span class="page-kicker"><i class="fa-solid fa-trophy"></i> Practice Arena</span>
            <h1 class="page-title">Challenges that make the <span class="text-accent-brand">fix stick</span></h1>
            <p class="page-lead">Solve mini versions of real bugs, earn AI-graded points, and climb the leaderboard.</p>

            <div class="row g-4 mb-4">
                <div class="col-lg-8">
                    <div class="surface-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h2 class="h5 mb-0">Available challenges</h2>
                            <span class="text-gray small" id="my-challenge-stats">Loading…</span>
                        </div>
                        <div class="challenge-list" id="challenges-grid">
                            <div class="empty-state">Loading challenges…</div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="surface-card">
                        <h2 class="h5 mb-3"><i class="fa-solid fa-medal text-accent-brand me-2"></i>Leaderboard</h2>
                        <div id="leaderboard"><div class="empty-state">Loading…</div></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="js/config.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/footer.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/challenges.js"></script>
</body>

</html>
